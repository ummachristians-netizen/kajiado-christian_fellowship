<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCF | Set a New Password</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1f33">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-wrap">
    <section class="admin-card">
      <img class="admin-logo" src="logo.svg" alt="Kajiado Christian Fellowship logo">
      <h2>Set a New Password</h2>
      <p class="kpi-label" style="margin:8px 0 14px;">Open this page using the secure recovery link sent to your email.</p>
      <form id="newPasswordForm">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required disabled>

        <label for="confirmNewPassword">Confirm new password</label>
        <input id="confirmNewPassword" type="password" minlength="8" autocomplete="new-password" required disabled>

        <button class="btn btn-primary" id="savePasswordBtn" type="submit" disabled>Save New Password</button>
        <a class="btn btn-outline" id="returnToLogin" href="admin-login.html" style="text-align:center;">Return to Login</a>
      </form>
      <p id="resetStatus" role="status" aria-live="polite" style="margin-top:12px;font-weight:700;">Checking your recovery link...</p>
    </section>
  </main>
  <script src="runtime-config.js"></script>
  <script type="module" src="reset-password.js"></script>
</body>
</html>
