<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kajiado Christian Fellowship | Ministry Office Access</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="manifest" href="admin-manifest.webmanifest">
    <meta name="theme-color" content="#0b1f33">
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="admin-wrap">
    <section class="admin-card">
        <img class="admin-logo" src="logo.svg" alt="Kajiado Christian Fellowship Logo">
        <h2>Ministry Office Access</h2>
        <p class="kpi-label" style="margin:8px 0 14px;">Authorized staff only. This page is separate from the public site menu.</p>
        <form id="adminLoginForm">
            <label for="adminEmail">Office Email</label>
            <input id="adminEmail" type="email" value="adminkcf@gmail.com" autocomplete="username" required>

            <label for="adminPassword">Password</label>
            <input id="adminPassword" type="password" placeholder="Enter your secure password" autocomplete="current-password" required>

            <button class="btn btn-primary" type="submit">Open Office Dashboard</button>
            <a class="btn btn-outline" href="index.html" style="text-align:center;text-decoration:none;">Return to Public Site</a>
        </form>
        <p id="loginStatus" role="status" aria-live="polite" style="margin-top:10px;font-weight:700;">Initializing secure login…</p>
        <p class="kpi-label" style="margin-top:10px;">Office admins are limited to 10 active accounts.</p>
    </section>
</main>
<script src="runtime-config.js"></script>
<script type="module" src="admin.js?v=9"></script>
<script>
    // Runs while the document is parsed, before the deferred module executes.
    // If the auth module fails to load, prevent a silent native form reload.
    window.__KCF_ADMIN_LOGIN_READY__ = false;
    const adminForm = document.getElementById("adminLoginForm");
    const loginStatus = document.getElementById("loginStatus");
    const showStartupError = (message) => {
        if (window.__KCF_ADMIN_LOGIN_READY__ || !loginStatus) return;
        loginStatus.textContent = message;
        loginStatus.style.color = "#b3261e";
    };
    window.addEventListener("error", (event) => {
        if (window.__KCF_ADMIN_LOGIN_READY__) return;
        const failedScript = event.target instanceof HTMLScriptElement ? event.target.src : "";
        const details = event.message || (failedScript ? `Failed to load ${new URL(failedScript).pathname}` : "Unexpected JavaScript startup error.");
        showStartupError(`Admin login startup error: ${details}`);
    }, true);
    window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        showStartupError(`Admin login startup error: ${reason?.message || String(reason || "Unhandled promise rejection.")}`);
    });
    adminForm?.addEventListener("submit", (event) => {
        if (window.__KCF_ADMIN_LOGIN_READY__) return;
        event.preventDefault();
        if (loginStatus?.textContent === "Initializing secure login…") {
            showStartupError("Secure login did not initialize. Check the startup error above, then refresh this page.");
        }
    });
    window.setTimeout(() => {
        if (window.__KCF_ADMIN_LOGIN_READY__ || !loginStatus || loginStatus.textContent !== "Initializing secure login…") return;
        loginStatus.textContent = "Secure login is taking too long to initialize. Check your connection and refresh the page.";
        loginStatus.style.color = "#b3261e";
    }, 8000);

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
</script>
</body>
</html>
