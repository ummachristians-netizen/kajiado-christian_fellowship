<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kajiado Christian Fellowship | Ministry Office Access</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="manifest" href="admin-manifest.webmanifest">
    <meta name="theme-color" content="#0b1f33">
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="admin-wrap">
    <section class="admin-card">
        <img class="admin-logo" src="logo.svg" alt="Kajiado Christian Fellowship Logo">
        <h2>Ministry Office Access</h2>
        <p class="kpi-label" style="margin:8px 0 14px;">Authorized staff only. This page is separate from the public site menu.</p>
        <form id="adminLoginForm">
            <label for="adminFullName">Full Name</label>
            <input id="adminFullName" type="text" placeholder="Office Admin Name">

            <label for="adminEmail">Office Email</label>
            <input id="adminEmail" type="email" value="ummachristians@gmail.com" autocomplete="username" required>

            <label for="adminPassword">Password</label>
            <input id="adminPassword" type="password" placeholder="Enter your secure password" autocomplete="current-password" required>

            <button class="btn btn-primary" type="submit">Open Office Dashboard</button>
            <button class="btn btn-outline" id="createAccountBtn" type="button">Register Office Account</button>
            <button class="btn btn-outline" id="resetPasswordBtn" type="button">Reset Password</button>
            <a class="btn btn-outline" href="index.html" style="text-align:center;text-decoration:none;">Return to Public Site</a>
        </form>
        <p id="loginStatus" style="margin-top:10px;font-weight:700;"></p>
        <p class="kpi-label" style="margin-top:10px;">Office admins are limited to 10 active accounts.</p>
    </section>
</main>
<script src="runtime-config.js"></script>
<script type="module" src="admin.js"></script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
</script>
</body>
</html>
